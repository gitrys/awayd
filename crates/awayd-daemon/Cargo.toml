# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "awayd-daemon"
description = "awayd resident agent: away/online status scheduler for Steam and Discord"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

[[bin]]
name = "awayd"
path = "src/main.rs"

[dependencies]
awayd-core = { path = "../awayd-core" }
awayd-ipc = { path = "../awayd-ipc" }
anyhow.workspace = true
async-trait = "0.1"
chrono.workspace = true
keyring = "2"
muda = "0.15"
open = "5"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
resvg = "0.44"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tray-icon = "0.19"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    # CreateMutexW (single instance); was only enabled indirectly through the wmi crate.
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Power",
    "Win32_System_Diagnostics_ToolHelp",
] }

[dev-dependencies]
chrono-tz = "0.10"
awayd-daemon = { path = ".", package = "awayd-daemon" }
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "sync", "time", "rt-multi-thread"] }
wiremock = "0.6"
awayd-core = { path = "../awayd-core" }

[build-dependencies]
winresource.workspace = true
