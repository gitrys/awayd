# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "sdss-daemon"
description = "Steam / Discord status scheduler resident agent (sdssd)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

[[bin]]
name = "sdssd"
path = "src/main.rs"

[dependencies]
sdss-core = { path = "../sdss-core" }
sdss-ipc = { path = "../sdss-ipc" }
anyhow.workspace = true
async-trait = "0.1"
chrono.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
keyring = "2"
muda = "0.15"
open = "5"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
resvg = "0.44"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tray-icon = "0.19"
wmi = "0.13"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Power",
    "Win32_System_Diagnostics_ToolHelp",
] }

[dev-dependencies]
chrono-tz = "0.10"
sdss-daemon = { path = ".", package = "sdss-daemon" }
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "sync", "time", "rt-multi-thread"] }
wiremock = "0.6"
sdss-core = { path = "../sdss-core" }
