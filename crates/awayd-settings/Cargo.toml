# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "awayd-settings"
description = "awayd settings GUI (egui)"
build = "build.rs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "awayd-settings"
path = "src/main.rs"

[dependencies]
awayd-core = { path = "../awayd-core" }
awayd-ipc = { path = "../awayd-ipc" }
anyhow.workspace = true
chrono.workspace = true
eframe = { version = "0.29", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
egui = "0.29"
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[build-dependencies]
winresource.workspace = true
