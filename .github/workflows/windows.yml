name: windows

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.74"
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo build release
        run: cargo build --release
      - name: cargo test
        run: cargo test
