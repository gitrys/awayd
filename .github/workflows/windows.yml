name: windows

on:
  push:
  pull_request:

jobs:
  test:
    name: fmt, build, test (stable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo build release
        run: cargo build --release --locked
      - name: cargo test
        # Serial: several integration tests set the process-wide APPDATA.
        run: cargo test --workspace --locked -- --test-threads=1

  msrv:
    name: check (MSRV 1.88)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with `rust-version` in Cargo.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - name: cargo check
        # Warnings are errors here: the pinned toolchain keeps the lint set fixed, so a new
        # stable release cannot break the build with new lints.
        env:
          RUSTFLAGS: -D warnings
        run: cargo check --workspace --all-targets --locked
