# cargo-about configuration: third-party license notices for release builds.
# `cargo about generate --frozen about.hbs -o THIRD_PARTY_LICENSES.html`
# A dependency under a license not listed here makes the generation fail on purpose.

targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "LicenseRef-UFL-1.0",
    "GPL-3.0-or-later",
    "CDLA-Permissive-2.0",
    "Unlicense",
    "0BSD",
    "CC0-1.0",
]

# epaint_default_fonts (fonts embedded in awayd-settings.exe) is partly under the Ubuntu Font
# Licence (LicenseRef-UFL-1.0). cargo-about 0.9.3 does not emit texts for LicenseRef-*
# licenses even when clarified, so build-portable.ps1 copies the crate's fonts/UFL.txt into
# the bundle as UBUNTU-FONT-LICENCE.txt.
